- id: skill-tests-at-scale
  order: 2
  year: 2026
  title: >-
    Designing and Implementing Skill Tests at Scale: Frequent, Computer-Based,
    Proctored Assessments with Minimal Infrastructure Requirements
  authors: >-
    Anastasiya Markova, Anish Kasam, Bryce Hackel, Marina Langlois, Sam Lau
  venue: >-
    ACM Technical Symposium on Computer Science Education (SIGCSE)
  blurb: >-
    Replacing a midterm with weekly 10-minute proctored programming quizzes
    ("Skill Tests") run by course staff in ordinary campus rooms reduced
    student anxiety without compromising final exam performance, offering a
    practical blueprint for frequent assessment that doesn't require dedicated
    institutional testing infrastructure.
  type: full paper
  pdf: /pubs/2026_skill-tests-at-scale_SIGCSE.pdf
