- id: emergency-pedagogical-design-genai-faculty
  order: 0
  year: 2026
  title: >-
    Barriers that Programming Instructors Face While Performing Emergency
    Pedagogical Design to Shape Student-AI Interactions with Generative AI Tools
  authors: >-
    Sam Lau, Kianoosh Boroojeni, Harry Keeling, Jenn Marroquin
  venue: >-
    ACM Conference on Human Factors in Computing Systems (CHI)
  award: Honorable Mention Award
  blurb: >-
    Through interviews with 13 computing instructors and a survey of 169
    instructors, we identify five key barriers that instructors face when
    performing "emergency pedagogical design" to reactively reshape their
    courses around student GenAI use: fragmented buy-in, conflicting policies,
    implementation challenges, assessment misfit, and lack of resources.
  type: full paper
  pdf: /pubs/2026_emergency-pedagogical-design-genai-faculty_CHI.pdf
  links:
    - name: O'Reilly Radar Article
      url: https://www.oreilly.com/radar/emergency-pedagogical-design-how-programming-instructors-are-scrambling-to-adapt-to-genai/
